
name: Build Test and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Train model
        run: python train_model.py

      - name: Evaluate model
        run: python evaluate_model.py

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/nagaimran13-maker/student-result-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name student-result-test \
            -p 5000:5000 \
            ghcr.io/nagaimran13-maker/student-result-ml:${{ github.sha }}

      - name: Test health endpoint
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          docker logs student-result-test
          exit 1

      - name: Test prediction API
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' \
            http://localhost:5000/predict)

          echo "$response"
          echo "$response" | grep -q '"prediction"'

      - name: Cleanup test container
        if: always()
        run: docker rm -f student-result-test || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        run: |
          docker tag ghcr.io/nagaimran13-maker/student-result-ml:${{ github.sha }} \
            ghcr.io/nagaimran13-maker/student-result-ml:latest

          docker push ghcr.io/nagaimran13-maker/student-result-ml:${{ github.sha }}
          docker push ghcr.io/nagaimran13-maker/student-result-ml:latest
